<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1913" />
    <title>PROSANTI রাইডার</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #0c1913; color: #f6f1e6;
        font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif;
        text-align: center; padding: 28px; box-sizing: border-box;
      }
      .card { max-width: 340px; }
      h1 { font-size: 20px; margin: 0 0 10px; color: #e6c374; }
      p { font-size: 14px; line-height: 1.7; margin: 0 0 22px; color: #d8d2c4; }
      button {
        font: inherit; font-size: 15px; font-weight: 600;
        background: #e6c374; color: #0c1913; border: 0;
        border-radius: 9999px; padding: 12px 26px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ইন্টারনেট সংযোগ নেই</h1>
      <p>
        রাইডার অ্যাপটি দোকানের সার্ভার থেকে চলে — তাই খুলতে সংযোগ লাগে।
        মোবাইল ডেটা বা ওয়াইফাই চালু করে আবার চেষ্টা করুন।
      </p>
      <button onclick="location.reload()">আবার চেষ্টা করুন</button>
    </div>
  </body>
</html>
