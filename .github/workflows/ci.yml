# CI — the gates that used to run only if somebody remembered (scan 2026-10-08).
#
# `.github/workflows/` held nothing but the shop clock, so lint, typecheck and
# the unit suite (3,450 of them) were never run automatically: Vercel catches a
# broken build on deploy, nothing catches a broken test.
#
# `npm run test:dashboards` joined on 2026-10-13. It had been left out with the
# storefront suite as "needs a seeded backend and a browser", but only half of
# that was true: `e2e/dashboards.spec.ts` intercepts every `**/api/**` call with
# its own fixtures and its config points the dev server at
# `https://verification.invalid`, so it needs a browser and nothing else. The
# browser was the only thing actually missing, and Actions provides it.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Round 3 hardening: the workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          # Next 16 needs Node 20.9+; 22 is what Vercel runs in production.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        # Security 2026-10-14 (L7): ship-blocking on production vulns only;
        # dev-only alerts (test tooling) stay visible in `npm audit` locally.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Types
        # Audit P2-03: next build already runs tsc; keep dedicated typecheck
        # with incremental cache so it stays under 30 s on cached runs.
        run: npm run typecheck -- --incremental

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Browser contracts: isolated dashboards first, then the entire default
  # Playwright suite (storefront, recovery, maps, native auth locks and SDK).
  # Authenticated responses are fixtures, not real account/RLS acceptance.
  # No secrets or seeded database; actual clicks run in Chromium.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Installs only Chromium: the suite pins one browser, and Firefox/WebKit
      # would triple the download for nothing.
      - name: Browsers
        run: npx playwright install --with-deps chromium

      - name: Dashboards
        run: npm run test:dashboards

      # Includes both auth specs; avoid running that subset twice.
      # The default config excludes dashboards, which ran above with their
      # own explicit invalid-host environment.
      - name: Full browser regression
        run: npm run test:e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .cache/playwright-report
          retention-days: 7
          if-no-files-found: ignore
